<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP画像ソース | hotChicken_sp</title>
<style>
  @font-face {
    font-family: "Shinonome Gothic";
    src: url("../css/fonts/JF-Dot-Shinonome16.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Shinonome Gothic";
    src: url("../css/fonts/JF-Dot-Shinonome16B.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0d0705;
    font-family: "Shinonome Gothic", "Hiragino Sans", sans-serif;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(circle at 12% 20%, rgba(230, 35, 30, 0.35), transparent 42%),
      radial-gradient(circle at 90% 5%, rgba(255, 204, 51, 0.22), transparent 38%),
      radial-gradient(circle at 60% 105%, rgba(255, 122, 26, 0.28), transparent 48%),
      #0d0705;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 80px;
  }

  .avatar {
    flex: none;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(140deg, #e6231e, #ff7a1a, #ffcc33);
    box-shadow: 0 0 70px rgba(230, 35, 30, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .text-block {
    flex: 1;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #ffcc33;
    font-weight: 700;
    font-size: 42px;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
  }

  .wordmark svg {
    width: 52px;
    height: 52px;
  }

  .headline {
    color: #ffcc33;
    font-weight: 700;
    font-size: 88px;
    line-height: 1.15;
    text-shadow: 0 0 20px rgba(255, 204, 51, 0.5), 0 0 46px rgba(230, 35, 30, 0.45);
    margin: 0 0 28px;
  }

  .headline span {
    color: #e6231e;
  }

  .tagline {
    color: #fbf1e6;
    font-size: 30px;
    margin: 0;
  }
</style>
</head>
<body>
<div class="card">
  <div class="avatar">
    <img src="../assets/icon.png" alt="">
  </div>
  <div class="text-block">
    <div class="wordmark">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <path d="M 63,27 C 42,32 22,50 16,72 C 13,83 12,90 18,94 C 27,90 34,82 44,72 C 54,62 62,50 66,40 C 69,32 71,26 70,23 C 68,21 66,23 63,27 Z" fill="#e6231e" stroke="#a3160f" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 56,38 C 46,50 34,64 24,78" stroke="#ff7a1a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
        <path d="M 64,24 C 66,15 74,9 84,10 C 82,18 74,24 66,28 Z" fill="#3a9a3a" stroke="#276b27" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M 63,26 C 70,22 78,20 85,22" stroke="#276b27" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </svg>
      SPCK
    </div>
    <h1 class="headline">辛口<span>スパチキ</span></h1>
    <p class="tagline">やりてぇことは全部やれ！</p>
  </div>
</div>
</body>
</html>
